# https://crontab.cronhub.io/
# https://sqatools.in/github-actions-fundamentals-for-beginners/

name: Manual Release
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

      message:
        description: 'Deployment Started'
        required: true
        default: 'Good morning, team!'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying to ${{ inputs.environment }}"
      - run: echo "${{ inputs.message }}"